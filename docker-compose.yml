  strapi:
    image: node:24.14.0-alpine
    container_name: strapi
    working_dir: /opt/app
    volumes:
      - ./back/strapi:/opt/app
      # - /opt/app/node_modules
      - ./scripts:/opt/app/scripts
      - ./shared:/opt/app/src/shared
      - ./back/strapi_data/.tmp:/opt/app/.tmp
      - ./back/strapi_data/uploads:/opt/app/public/uploads
    ports:
      - "${STRAPI_PORT:-1340}:1337"
    env_file: .env
    environment:
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: development
      STRAPI_AUTO_INIT: 'false'
    command: >
      sh -c "if [ ! -d 'node_modules' ]; then npm install; fi && npm run develop"    # command: >
    #     npm run develop
    restart: unless-stopped
    # network_mode: "host"